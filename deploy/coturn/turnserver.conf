# Pico TURN relay (coturn) — the fallback path when two peers cannot connect
# directly (symmetric NAT, strict corporate firewalls, some mobile carriers).
#
# Media relayed here is still DTLS-SRTP end-to-end encrypted: coturn only ever
# sees ciphertext and cannot read or hear anything.
#
# Required open firewall ports:
#   3478/udp + 3478/tcp   TURN listener
#   {{{TURN_TLS_PORT}}}/tcp   TURN over TLS (turns:) — the firewalled-networks fallback
#   49152-65535/udp       relay port range (the full dynamic/high band)
#
# The credential secret is injected via the TURN_SECRET env var (docker compose).
# Placeholders {{{PICO_DOMAIN}}}, {{{TURN_SECRET}}}, {{{TURN_PUBLIC_IP}}} and
# {{{TURN_TLS_PORT}}} are substituted from your .env at deploy time (see DEPLOY.md).

listening-port=3478

# TURN over TLS on TCP {{{TURN_TLS_PORT}}} (turns:). Browsers VALIDATE TURN TLS
# certificates — a self-signed cert is rejected and this fallback path never
# engages. The compose entrypoint serves the real Let's Encrypt certificate
# Caddy already obtained for the domain (shared caddy_data volume); the
# self-signed mint below is only a last-resort fallback that logs a warning.
tls-listening-port={{{TURN_TLS_PORT}}}
cert={{{TURN_CERT}}}
pkey={{{TURN_KEY}}}

# Realm shown to clients; keep it your domain.
realm={{{PICO_DOMAIN}}}
server-name={{{PICO_DOMAIN}}}

# Time-limited REST credentials (matches /api/ice in the Next app).
use-auth-secret
static-auth-secret={{{TURN_SECRET}}}

# Relay ports: the full dynamic/high band 49152-65535 — 16,384 relay ports,
# enough for ~16k concurrent relayed media streams (a relayed call holds ~1
# relay port per peer direction, so even a large fully-relayed mesh fits).
# Deployment notes:
#  - Docker: coturn runs with network_mode: host (see docker-compose.yml), so
#    these ports are bound DIRECTLY on the host — nothing to publish in
#    `ports:`. A "49152-65535:49152-65535/udp" mapping only makes sense for a
#    bridge-networked coturn, and costs per-packet DNAT over 16k ports plus a
#    docker-proxy that breaks real-client-IP logging. Firewall: open
#    49152-65535/udp inbound on the host.
#  - Linux hands OUTBOUND sockets ephemeral ports from
#    net.ipv4.ip_local_port_range (commonly 32768-60999), which overlaps
#    49152-60999 — on a busy host, unrelated egress can collide with relay
#    binds. On the TURN host:
#      sysctl -w net.ipv4.ip_local_port_range="1024 49151"
min-port=49152
max-port=65535

# Announce the public address behind NAT (required on cloud VPSes).
external-ip={{{TURN_PUBLIC_IP}}}

# Public/clean configuration — no CLI, no private-network relays.
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-loopback-peers
# denied-peer-ip / no-multicast-peers / no-loopback-peers restrict the RELAY
# TARGET (the peer address a client asks to reach) — NOT the client's own
# source IP. Clients arriving through the Caddy SNI multiplex all appear as
# 127.0.0.1 and are unaffected: client-side ACLs would be allowed-client-ip /
# denied-client-ip, deliberately NOT set (the multiplex depends on loopback).
# The quotas below are keyed by username (REST auth), so the shared
# 127.0.0.1 source address does not affect them either.
# RFC 1918 private ranges
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# RFC 6598 carrier-grade NAT (mobile carriers relay toward these)
denied-peer-ip=100.64.0.0-100.127.255.255
# RFC 3927 link-local
denied-peer-ip=169.254.0.0-169.254.255.255
# loopback (client side is additionally covered by no-loopback-peers)
denied-peer-ip=127.0.0.0-127.255.255.255
# IPv6: loopback, ULA (fc00::/7), link-local (fe80::/10)
denied-peer-ip=::1-::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Allocation quotas (per username / server total; 0 = unlimited). A relayed
# call holds ~1 allocation per peer, so user-quota=30 covers a 25-person mesh
# with headroom. total-quota=1000 is the server-wide storm guard — with the
# 16,384-port relay range the quota, not the port count, is now the binding
# limit; raise it with host capacity if you need more relayed calls.
user-quota=30
total-quota=1000

# Logging — small and useful.
log-file=stdout
verbose
