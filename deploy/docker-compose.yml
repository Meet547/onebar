# Pico — full production stack: app + signaling + TURN relay + TLS gateway.
#
#   cp .env.example .env   (fill in PICO_DOMAIN, TURN_SECRET, TURN_PUBLIC_IP…)
#   docker compose up -d --build
#
# Services
#   app        Next.js (Pico UI)                 internal :3000
#   signaling  socket.io relay + room-info probe internal :3003 / :3004
#   coturn     TURN/STUN relay (NAT fallback)    host network :3478/udp+tcp,
#                                                :8443/tcp TLS (turns:, TURN_TLS_PORT),
#                                                :49160-49200/udp
#   caddy      automatic HTTPS gateway           :80, :443
#
# coturn uses host networking (the only reliable way to get real relay IPs);
# everything else lives on the compose bridge network.
#
# TCP 443 is Caddy's. coturn's TLS listener therefore defaults to 8443 on a
# single-IP host — a convenience default, NOT a guarantee: firewalls that
# allow only outbound 80+443 block 8443 just like 3478. True turns:…:443
# (dedicated IP or SNI multiplex via Caddy layer4) is REQUIRED if corporate/
# hotel Wi-Fi matters — both documented in DEPLOY.md (the SNI shape there is
# validated against a real Caddy+layer4 build). The turns: certificate must
# be REAL (browsers validate TURN TLS certs); the coturn entrypoint reuses
# the Let's Encrypt cert from Caddy's storage and reloads on SIGUSR2 when
# Caddy renews it.

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.standalone
      args:
        NEXT_PUBLIC_SIGNALING_URL: ${PICO_SIGNALING_URL:-/}
        NEXT_PUBLIC_SOCKET_PATH: /socket.io
        NEXT_PUBLIC_ROOM_INFO_URL: ${PICO_ROOM_INFO_URL:-/info}
        NEXT_PUBLIC_SITE_URL: https://${PICO_DOMAIN}
    image: pico-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # /api/ice hands these to every client. TURN runs on this host (coturn
      # below) on 3478 UDP + TCP, plus a TLS listener (turns:) on TURN_TLS_PORT
      # — /api/ice derives the turns: entry from this port automatically.
      # (Co-locating coturn TLS on 443 with Caddy needs a dedicated IP or SNI
      # multiplexing — see DEPLOY.md; the single-IP default is 8443.)
      - TURN_URLS=turn:${PICO_DOMAIN}:3478?transport=udp,turn:${PICO_DOMAIN}:3478?transport=tcp
      - TURN_SECRET=${TURN_SECRET}
      - TURN_TLS_PORT=${TURN_TLS_PORT:-8443}
      # Hostname of the turns: listener — the name whose certificate coturn
      # serves and whose SNI the Caddy layer4 multiplex matches. Defaults to
      # turn.<domain>; needs a DNS record for that name (Caddy obtains a
      # dedicated LE cert for it). Must stay consistent with the Caddyfile.
      - TURN_TLS_HOST=${TURN_TLS_HOST:-turn.${PICO_DOMAIN}}
      # The relay is its own supervised container here — the in-app embedded
      # relay is switched off, and the app's rewrites point at the container.
      - PICO_EMBEDDED_RELAY=0
      - RELAY_UPSTREAM=http://signaling:3003
      - INFO_UPSTREAM=http://signaling:3004
    networks:
      - pico

  signaling:
    build: ../mini-services/signaling
    image: pico-signaling
    restart: unless-stopped
    expose:
      - "3003"
      - "3004"
    environment:
      - PORT=3003
      - INFO_PORT=3004
      - SOCKET_PATH=/socket.io
      - ORIGIN=https://${PICO_DOMAIN}
    networks:
      - pico

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    # host networking: TURN must see real client IPs and bind the UDP relay range
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf.template:ro
      # The turns: listener needs a REAL certificate — browsers validate TURN
      # TLS certificates and reject self-signed ones. Caddy already obtains a
      # Let's Encrypt cert for the domain; sharing its data volume lets coturn
      # serve exactly that cert (read-only).
      - caddy_data:/etc/coturn/acme:ro
      # Fallback store for the (discouraged) self-signed mint.
      - coturn_certs:/etc/coturn/certs
    # Substitute the template placeholders, locate the real ACME cert, run,
    # and watch the certificate files: coturn only re-reads certificates on
    # SIGUSR2 (SIGHUP just resets the log file), so without this watcher a
    # Caddy renewal at ~day 60 would leave TURN serving the stale cert until
    # it expires. Fresh deploys: Caddy has no cert yet on the very first
    # boot — coturn starts with a loud warning + self-signed fallback;
    # restart it after Caddy's first issuance: `docker compose restart coturn`.
    entrypoint:
      - /bin/sh
      - -c
      - |
        TURN_HOST="${TURN_TLS_HOST:-turn.${PICO_DOMAIN}}"
        CRT=$(find /etc/coturn/acme -type f -name "${TURN_HOST}.crt" 2>/dev/null | head -n1)
        KEY=$(find /etc/coturn/acme -type f -name "${TURN_HOST}.key" 2>/dev/null | head -n1)
        if [ -n "$CRT" ] && [ -n "$KEY" ]; then
          echo "[coturn] turns: serving the ACME certificate for ${TURN_HOST} (Caddy storage; the .crt is the fullchain)"
        elif [ -n "${TURN_CERT_FILE:-}" ] && [ -n "${TURN_KEY_FILE:-}" ] && [ -f "${TURN_CERT_FILE}" ] && [ -f "${TURN_KEY_FILE}" ]; then
          CRT="${TURN_CERT_FILE}"; KEY="${TURN_KEY_FILE}"
          echo "[coturn] turns: serving TURN_CERT_FILE / TURN_KEY_FILE"
        else
          if [ "${TURN_HOST}" != "${PICO_DOMAIN}" ]; then
            echo "[coturn] WARNING: no certificate for ${TURN_HOST} in Caddy storage yet — check the DNS record for ${TURN_HOST} and that Caddy is running ('docker compose logs caddy' shows issuance)."
          fi
          echo "[coturn] WARNING: no real certificate for turns:. Browsers VALIDATE TURN TLS certificates — self-signed gets rejected and the strict-firewall fallback will fail. Fix: start Caddy first (it obtains the LE cert), then 'docker compose restart coturn'; or mount TURN_CERT_FILE / TURN_KEY_FILE. See DEPLOY.md."
          mkdir -p /etc/coturn/certs
          [ -f /etc/coturn/certs/turn.crt ] && [ -f /etc/coturn/certs/turn.key ] || \
            openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
              -keyout /etc/coturn/certs/turn.key -out /etc/coturn/certs/turn.crt \
              -subj "/CN=${TURN_HOST}" >/dev/null 2>&1
          CRT=/etc/coturn/certs/turn.crt
          KEY=/etc/coturn/certs/turn.key
        fi
        sed -e "s/{{{PICO_DOMAIN}}}/${PICO_DOMAIN}/g" \
            -e "s/{{{TURN_SECRET}}}/${TURN_SECRET}/g" \
            -e "s/{{{TURN_PUBLIC_IP}}}/${TURN_PUBLIC_IP}/g" \
            -e "s/{{{TURN_TLS_PORT}}}/${TURN_TLS_PORT:-8443}/g" \
            -e "s|{{{TURN_CERT}}}|$CRT|g" \
            -e "s|{{{TURN_KEY}}}|$KEY|g" \
            /etc/coturn/turnserver.conf.template > /tmp/turnserver.conf
        # Health/writer state for the healthcheck below and the watcher.
        echo "$CRT" > /tmp/turn-cert-path
        echo "${TURN_HOST}" > /tmp/turn-host
        cat > /tmp/turn-health.sh <<'HEALTH'
        [ -r /tmp/turn-pid ] && kill -0 "$(cat /tmp/turn-pid)" 2>/dev/null || exit 1
        CRT=$(cat /tmp/turn-cert-path 2>/dev/null)
        [ -n "$CRT" ] && [ -r "$CRT" ] || exit 1
        openssl x509 -checkend 1209600 -noout -in "$CRT" 2>/dev/null || exit 1
        HOST=$(cat /tmp/turn-host 2>/dev/null)
        [ -n "$HOST" ] || exit 1
        SAN=$(openssl x509 -in "$CRT" -noout -ext subjectAltName 2>/dev/null)
        SUBJ=$(openssl x509 -in "$CRT" -noout -subject 2>/dev/null)
        echo "$SAN" | grep -qiF "DNS:$HOST" && exit 0
        WILD="*.${HOST#*.}"
        echo "$SAN" | grep -qiF "DNS:$WILD" && exit 0
        echo "$SUBJ" | grep -qiE "CN *= *$HOST" && exit 0
        echo "$SUBJ" | grep -qiF "CN = $WILD" && exit 0
        echo "[coturn] health: certificate does not match ${HOST}" >&2
        exit 1
        HEALTH

        turnserver -c /tmp/turnserver.conf &
        TURN_PID=$!
        echo "$TURN_PID" > /tmp/turn-pid
        trap 'kill -TERM "$TURN_PID" 2>/dev/null' TERM INT
        # Renewal watcher: reload on certificate change. coturn reloads
        # certs on SIGUSR2 only (coturn issue #725 — SIGHUP resets the log).
        LAST=$(sha256sum "$CRT" "$KEY" 2>/dev/null | sha256sum | cut -d" " -f1)
        while kill -0 "$TURN_PID" 2>/dev/null; do
          sleep "${TURN_CERT_CHECK_INTERVAL:-300}"
          [ -r "$CRT" ] && [ -r "$KEY" ] || continue
          if ! openssl x509 -checkend 1209600 -noout -in "$CRT" 2>/dev/null; then
            echo "[coturn] WARNING: turns: certificate expires within 14 days and has not been renewed — check Caddy/certbot; container will report unhealthy."
          fi
          NOW=$(sha256sum "$CRT" "$KEY" 2>/dev/null | sha256sum | cut -d" " -f1)
          if [ -n "$NOW" ] && [ "$NOW" != "$LAST" ]; then
            echo "[coturn] turns: certificate changed — SIGUSR2 reload"
            LAST="$NOW"
            kill -USR2 "$TURN_PID" 2>/dev/null || true
          fi
        done
        wait "$TURN_PID"
    # Fails (→ unhealthy) when the relay process is gone, the turns:
    # certificate is missing/unreadable, it is within 14 days of expiry, or
    # it does not match TURN_TLS_HOST (SAN/CN) — i.e. the renewal pipeline is
    # broken or the SNI host and the served cert disagree.
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh /tmp/turn-health.sh"]
      interval: 1h
      timeout: 10s
      retries: 2
      start_period: 30s
    # 3478/udp+tcp (TURN), TURN_TLS_PORT/tcp (turns: TLS), 49160-49200/udp are bound by the conf

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - PICO_DOMAIN=${PICO_DOMAIN}
      # Site block below obtains/renews the LE cert for the TURN SNI host.
      - TURN_TLS_HOST=${TURN_TLS_HOST:-turn.${PICO_DOMAIN}}
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - pico
    depends_on:
      - app
      - signaling

volumes:
  caddy_data:
  caddy_config:
  coturn_certs:

networks:
  pico:
